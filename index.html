<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SBA Laufkalkulation">
<meta name="theme-color" content="#7C1F2D">
<title>SBA Laufkalkulation</title>
<style>
:root{
  --red:#DA291C; --red-d:#B11E14; --bord:#7C1F2D; --bord-d:#5E1420;
  --ink:#14181f; --ink2:#3a4350; --muted:#6b7785; --faint:#9aa3af;
  --line:#e6e9ee; --bg:#f4f6f9; --card:#ffffff; --field:#fbfcfe;
  --red-soft:rgba(218,41,28,.08);
  --blau:#2E5FD0; --blau-soft:rgba(46,95,208,.09);
  --rot:#DA291C; --rot-soft:rgba(218,41,28,.08);
  --good:#1f9d6b;
  --shadow:0 1px 3px rgba(20,24,31,.06),0 6px 22px rgba(20,24,31,.06);
  --radius:16px; --radius-sm:9px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}

/* ================= LOGIN ================= */
#login{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#7C1F2D 0%,#5E1420 55%,#3f0d16 100%);
  padding:24px 18px calc(24px + var(--sab));overflow:hidden;
}
.gates{position:absolute;inset:0;pointer-events:none;opacity:.5}
.gates svg{width:100%;height:100%}
.login-card{
  position:relative;width:100%;max-width:380px;background:#fff;border-radius:22px;
  box-shadow:0 24px 70px rgba(0,0,0,.45);padding:30px 26px calc(26px);
  animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes rise{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.login-card .stripe{display:flex;gap:0;height:5px;border-radius:99px;overflow:hidden;margin-bottom:22px}
.login-card .stripe i{flex:1}
.login-card .stripe i:first-child{background:var(--blau)}
.login-card .stripe i:last-child{background:var(--rot)}
.login-logo{height:26px;width:auto;margin-bottom:16px}
.login-card h1{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px;text-wrap:balance}
.login-card .lsub{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:22px}
.login-field{position:relative;margin-bottom:12px}
.login-field input{
  width:100%;background:var(--field);border:1.6px solid var(--line);border-radius:12px;
  padding:14px 46px 14px 14px;font-size:16px;transition:border-color .15s;
}
.login-field input:focus{outline:none;border-color:var(--red)}
.login-field .peek{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:9px}
.login-field .peek svg{width:17px;height:17px;stroke:var(--faint)}
.login-btn{
  width:100%;background:var(--red);color:#fff;font-size:15px;font-weight:700;
  padding:14px;border-radius:12px;box-shadow:0 4px 16px rgba(218,41,28,.4);transition:.15s;
}
.login-btn:active{background:var(--red-d)}
.lhint{font-size:11.5px;color:var(--faint);text-align:center;margin-top:16px;line-height:1.5}
.lerr{
  font-size:12.5px;color:var(--red);font-weight:600;text-align:center;margin-top:10px;min-height:16px;
}
.login-card.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media(prefers-reduced-motion:reduce){.login-card,.login-card.shake{animation:none}.livechip i{animation:none}}

/* ================= TOPBAR ================= */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(120deg,#7C1F2D 0%,#5E1420 100%);color:#fff;
  padding:calc(10px + var(--sat)) 16px 10px;
  box-shadow:0 2px 14px rgba(94,20,32,.25);
}
.topbar-row{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.logo-svg{height:22px;width:auto;flex:none;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.brand{border-left:1px solid rgba(255,255,255,.28);padding-left:11px;min-width:0}
.brand h1{font-size:14px;font-weight:700;line-height:1.15;white-space:nowrap}
.brand .sub{font-size:10px;color:rgba(255,255,255,.66);font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.livechip{
  margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 10px;color:#fff;
  white-space:nowrap;
}
.livechip i{width:7px;height:7px;border-radius:50%;background:#9aa3af;flex:none}
.livechip.live i{background:#4ade80;animation:pulse 1.6s infinite}
.livechip.saving i{background:#fbbf24}
.livechip.off i{background:#9aa3af}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.iconbtn{
  width:38px;height:38px;border-radius:var(--radius-sm);flex-shrink:0;
  background:rgba(255,255,255,.12);border:1.4px solid rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.iconbtn svg{width:17px;height:17px;stroke:#fff}
.iconbtn:active{background:rgba(255,255,255,.22)}
.event-select-wrap{position:relative;flex:1;min-width:0;max-width:320px;margin-left:auto}
.event-select-wrap svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);pointer-events:none}
select.event-select{
  width:100%;appearance:none;-webkit-appearance:none;background:#fff;color:var(--ink);
  border:none;border-radius:var(--radius-sm);padding:8px 30px 8px 12px;font-size:16px;font-weight:650;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.25);
}

/* ================= LAYOUT / TABS ================= */
.main{max-width:1100px;margin:0 auto;padding:14px 14px calc(60px + var(--sab))}
.seg{display:flex;background:#d5dce6;border:1.4px solid #c2cbd7;border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;border-radius:8px;font-size:14px;font-weight:650;color:var(--ink2);white-space:nowrap;transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.22);font-weight:700}
.runrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;padding:6px 15px;border-radius:20px;font-size:12.5px;font-weight:700;
  background:#fbfcfe;border:1.4px solid var(--line);color:var(--ink2);transition:.12s;
}
.pill.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.pill.ghost{color:var(--faint);font-weight:650}
.runrow .spacer{flex:1}
.mode-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.mode-toggle .pill{padding:4px 12px;font-size:12px}
.evpick{position:relative;margin-bottom:12px}
.evpick > svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);pointer-events:none}
select.evpick-select{
  width:100%;appearance:none;-webkit-appearance:none;background:var(--card);color:var(--ink);
  border:1.4px solid var(--line);border-radius:12px;padding:12px 42px 12px 14px;
  font-size:16px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
select.evpick-select:focus{outline:none;border-color:var(--red)}
.offbanner{
  display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--bord);font-weight:600;
  background:var(--red-soft);border:1.4px solid rgba(124,31,45,.3);border-radius:var(--radius-sm);
  padding:8px 12px;margin-bottom:12px;
}

/* ================= EDITOR (Command Center) ================= */
.courses{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){.courses{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:0}
.course-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.course-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.course-head h3{font-size:14.5px;font-weight:700;flex:1}
.course-best{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.course-best b{color:var(--ink);font-size:13px}
.card.blau .course-head{background:var(--blau-soft)} .card.blau .course-dot{background:var(--blau)} .card.blau .course-head h3{color:var(--blau)}
.card.rot .course-head{background:var(--rot-soft)} .card.rot .course-dot{background:var(--rot)} .card.rot .course-head h3{color:var(--rot)}
table.ath{width:100%;border-collapse:collapse}
table.ath th{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);text-align:left;padding:9px 8px 7px;border-bottom:2px solid var(--line);font-weight:700}
table.ath td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ath tr:last-child td{border-bottom:none}
td.rank{width:30px;text-align:center;font-size:13px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
tr.is-best td.rank{color:var(--red)}
.ath input{width:100%;background:transparent;border:1.4px solid transparent;border-radius:7px;padding:8px;font-size:16px;min-height:38px;color:var(--ink)}
.ath input::placeholder{color:var(--faint)}
.ath input:focus{outline:none;background:var(--field);border-color:#c2cbd7}
.ath input.num{font-variant-numeric:tabular-nums;text-align:right;width:86px}
.ath input.name{font-weight:650;text-transform:uppercase}
td.diffcell{width:64px;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:10px}
td.meancell{width:70px;text-align:right;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;padding-right:10px}
td.delcell{width:34px;text-align:center}
.delbtn{width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;opacity:.6}
.delbtn svg{width:13px;height:13px;stroke:var(--muted)}
.delbtn:active{background:var(--bg);opacity:1}
.addrow{padding:10px 12px}
.addbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;border:1.4px dashed #c2cbd7;border-radius:var(--radius-sm);color:var(--muted);font-size:13px;font-weight:650}
.addbtn svg{width:14px;height:14px;stroke:var(--muted)}
.addbtn:active{background:var(--bg)}
.empty-hint{padding:18px 14px;text-align:center;color:var(--faint);font-size:13px}
.analyse{margin-top:16px}
.verdict{display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);margin-bottom:12px}
.verdict .vdot{width:14px;height:14px;border-radius:5px;flex-shrink:0}
.verdict .vtext{flex:1;font-size:14px;line-height:1.45;color:var(--ink2)}
.verdict .vtext b{font-size:15px;color:var(--ink)}
.verdict .vdelta{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict.neutral .vdot{background:var(--faint)}
.chartcard{padding:16px 18px 14px}
.chartcard h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:4px;font-weight:700}
.chartcard .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.dchart{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;align-items:center;gap:8px}
.drow .dl{width:52px;font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dtrack{flex:1;position:relative;height:22px}
.dmid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1.4px;background:#c2cbd7}
.dbar{position:absolute;top:3px;height:16px;border-radius:4px;min-width:2px}
.dval{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dlegend{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.dlegend span{display:inline-flex;align-items:center;gap:6px}
.dlegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sum-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.sum-grid{grid-template-columns:1fr 1fr}}
.sumcard{padding:15px 18px}
.sumcard .sc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sumcard .sc-head h4{font-size:13.5px;font-weight:700}
.chip{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;letter-spacing:.3px;white-space:nowrap}
.chip.blau{background:var(--blau-soft);color:var(--blau)}
.chip.rot{background:var(--rot-soft);color:var(--rot)}
.chip.neutral{background:var(--bg);color:var(--muted)}
.sumline{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;color:var(--muted)}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:650}
.sumline .cb{color:var(--blau);font-weight:700} .sumline .cr{color:var(--rot);font-weight:700}
table.sumtab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.sumtab th{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);text-align:right;padding:8px;border-bottom:2px solid var(--line);font-weight:700}
table.sumtab th:first-child{text-align:left}
table.sumtab td{padding:8px;border-bottom:1px solid var(--line);text-align:right;color:var(--ink2)}
table.sumtab td:first-child{text-align:left;color:var(--ink);font-weight:650}
table.sumtab tr:last-child td{border-bottom:none}

/* ================= COACH (kompakt) ================= */
.ccard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.runhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.runhead h3{font-size:14px;font-weight:700;flex:1}
.duo{display:grid;grid-template-columns:1fr 1fr}
.col{padding:8px 10px 10px;min-width:0}
.col + .col{border-left:1px solid var(--line)}
.colhead{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:2px 2px 6px}
.colhead i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.col.b .colhead{color:var(--blau)} .col.b .colhead i{background:var(--blau)}
.col.r .colhead{color:var(--rot)} .col.r .colhead i{background:var(--rot)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.t td{padding:4.5px 3px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:last-child td{border-bottom:none}
td.rk{width:20px;color:var(--faint);font-weight:700;font-size:11px}
tr.best td.rk{color:var(--red)}
td.nm{font-weight:650;overflow:hidden;text-overflow:ellipsis;max-width:0}
td.zt{text-align:right;font-weight:600;width:52px}
td.df{text-align:right;color:var(--muted);font-size:11px;width:42px}
.emptycol{padding:14px 4px;text-align:center;color:var(--faint);font-size:12px}
.deltarow{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--field);border-top:1px solid var(--line)}
.deltarow .txt{flex:1;font-size:12.5px;color:var(--ink2);line-height:1.4}
.deltarow .txt b{color:var(--ink)}
.deltarow .num{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ccard .sumhead{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:8px}
.ccard.sumwrap{padding:13px 14px}
table.s{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.s th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);text-align:right;padding:5px 4px;border-bottom:2px solid var(--line);font-weight:700}
table.s th:first-child{text-align:left}
table.s td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;color:var(--ink2)}
table.s td:first-child{text-align:left;color:var(--ink);font-weight:650}
table.s tr:last-child td{border-bottom:none}
@media(max-width:480px){ td.df{display:none} td.zt{width:48px} }

/* ================= SHEETS / TOAST ================= */
.overlay{position:fixed;inset:0;background:rgba(20,24,31,.45);z-index:90;display:none;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@media(min-width:640px){.overlay{align-items:center}}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;padding:18px 18px calc(18px + var(--sab));box-shadow:0 -8px 40px rgba(20,24,31,.25)}
@media(min-width:640px){.sheet{border-radius:18px;padding-bottom:18px;box-shadow:0 20px 60px rgba(20,24,31,.3)}}
.sheet h3{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.sheet h3 svg{width:17px;height:17px;stroke:var(--red)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{width:100%;background:var(--field);border:1.4px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:16px;appearance:none;-webkit-appearance:none;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--red)}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;text-align:center;background:#fff;border:1.4px solid var(--line);color:var(--ink2);transition:.15s}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 2px 10px rgba(218,41,28,.35)}
.btn.primary:active{background:var(--red-d)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:active{filter:brightness(.96)}
.menu-list{display:flex;flex-direction:column;gap:2px}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:var(--radius-sm);font-size:14.5px;font-weight:600;text-align:left;width:100%;color:var(--ink2)}
.menu-item svg{width:17px;height:17px;stroke:var(--muted);flex-shrink:0}
.menu-item:active{background:var(--bg)}
.menu-item.danger{color:var(--red)}
.menu-item.danger svg{stroke:var(--red)}
.menu-sep{height:1px;background:var(--line);margin:6px 0}
.note{font-size:12.5px;color:var(--ink2);line-height:1.55;background:var(--field);border:1.4px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px}
.note.warn{border-color:rgba(218,41,28,.45);background:var(--red-soft)}
.toast{
  visibility:hidden;opacity:0;position:fixed;bottom:calc(20px + var(--sab));left:50%;
  transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:220;
  transition:transform .25s ease,opacity .2s;box-shadow:0 6px 24px rgba(20,24,31,.35);max-width:90vw;text-align:center;
}
.toast.show{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}
.updated{text-align:center;color:var(--faint);font-size:11px;padding:10px 0 4px}
@media(max-width:700px){
  .brand{display:none}
  th.mean-h,td.meancell{display:none}
  .ath input.num{width:76px}
  td.diffcell{width:54px;padding-right:6px}
  .event-select-wrap{max-width:none}
  .logo-svg{height:19px}
}

/* ===== Ergänzung Michael/Claude: Kernaussage gross ===== */
.bigverdict{display:flex;align-items:baseline;gap:10px;border-radius:12px;padding:15px 16px;margin:2px 0 12px;color:#fff;box-shadow:var(--shadow)}
.bigverdict.blau{background:var(--blau)}
.bigverdict.rot{background:var(--rot)}
.bigverdict.neutral{background:#8a93a0}
.bigverdict.open{background:var(--field);color:var(--muted);border:1.5px dashed var(--line);box-shadow:none}
.bigverdict .bv-course{font-size:27px;font-weight:900;letter-spacing:.02em;line-height:1}
.bigverdict .bv-txt{font-size:13px;font-weight:600;opacity:.92}
.bigverdict .bv-delta{margin-left:auto;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.bigverdict .bv-warn{font-size:11px;font-weight:700;background:rgba(255,255,255,.2);border-radius:6px;padding:3px 7px;align-self:center}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.vtile{border-radius:12px;padding:12px 14px;color:#fff;box-shadow:var(--shadow)}
.vtile.blau{background:var(--blau)}
.vtile.rot{background:var(--rot)}
.vtile.neutral{background:#8a93a0}
.vtile.open{background:var(--field);color:var(--muted);border:1.5px dashed var(--line);box-shadow:none}
.vtile .vt-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.9;margin-bottom:4px}
.vtile .vt-course{font-size:22px;font-weight:900;line-height:1.05}
.vtile .vt-delta{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;opacity:.95}
@media(max-width:360px){.vgrid{grid-template-columns:1fr}}

/* ===== Ergänzungen Michael/Claude: Paarvergleich, Stabilität ===== */
.chip.warn{background:rgba(255,170,0,.13);color:#a26a00;border:1px solid rgba(255,170,0,.35)}
.stabnote{font-size:12px;font-weight:600;margin:8px 2px 0;display:flex;align-items:center;gap:6px}
.stabnote.ok{color:var(--good)}
.stabnote.warn{color:#a26a00}
.pairedcard{padding:16px 18px 14px;margin-top:14px}
.pairedcard .sc-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pairedcard h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
.pairedcard .sub{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
table.ptab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.ptab th{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);text-align:right;padding:7px 8px;border-bottom:2px solid var(--line);font-weight:700}
table.ptab td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;color:var(--ink2)}
table.ptab td:first-child{color:var(--ink);font-weight:650}
table.ptab tr:last-child td{border-bottom:none}
</style>
</head>

<script>
"use strict";

/* ---------- State aus dem eingebetteten JSON ---------- */

try {

  const parsed = JSON.parse(raw);
  if (parsed && parsed.events) state = parsed;
} catch (e) { /* leerer Start */ }

const ui = { role: null, currentEventId: null, gender: "frauen", runId: "q1", entryMode: "zeit" };

/* ============================================================
   FIREBASE-KONFIGURATION — HIER EINSETZEN
   Firebase Console → Projekteinstellungen → Deine Apps → Web-App
   → "SDK-Konfiguration" kopieren und die Werte unten ersetzen.
   Wichtig: databaseURL muss dabei sein (Realtime Database).
   Solange hier "HIER_EINSETZEN" steht, läuft die App im Demo-Modus.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBXZYpxJZgblLr_aBGTo7czWe_IE-giSr4",
  authDomain: "sba-laufkalkulation.firebaseapp.com",
  databaseURL: "https://sba-laufkalkulation-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sba-laufkalkulation",
  storageBucket: "sba-laufkalkulation.firebasestorage.app",
  messagingSenderId: "93109655681",
  appId: "1:93109655681:web:7d5784f1f5127521b79580",
};
/* Dieses Firebase-Benutzerkonto legt ihr einmalig an (Authentication →
   E-Mail/Passwort). Passwort des Kontos = Command-Center-Passwort. */
const CC_EMAIL = "command-center@sba.app";

/* ---------- Server-Sync (Firebase Realtime Database) ---------- */
const DEMO = /HIER_EINSETZEN/.test(JSON.stringify(FIREBASE_CONFIG));
let FB = null;                  // Firebase-Handles, sobald verbunden
let fbFailed = false;
let dirty = false, pushing = false, connected = false, pushTimer = null;
let dbEmpty = false;

function normalizeState(data) {
  /* RTDB lässt leere Arrays/Objekte weg — Struktur wiederherstellen */
  const evs = Array.isArray(data.events) ? data.events.filter(Boolean) : Object.values(data.events || {});
  for (const ev of evs) {
    ev.runs = (Array.isArray(ev.runs) ? ev.runs : Object.values(ev.runs || {})).filter(Boolean);
    for (const r of ev.runs) {
      for (const g of ["frauen", "maenner"]) {
        r[g] = r[g] || {};
        for (const k of ["blau", "rot"]) {
          const l = r[g][k];
          r[g][k] = (Array.isArray(l) ? l : Object.values(l || {})).filter(Boolean);
          for (const e of r[g][k]) { if (e.zeit === undefined) e.zeit = null; if (e.name === undefined) e.name = ""; }
        }
      }
    }
  }
  return { v: 1, events: evs, updatedAt: data.updatedAt || null };
}

async function initFirebase() {
  if (DEMO) { updateStatus(); return; }
  try {
    const appM  = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const dbM   = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const authM = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const app = appM.initializeApp(FIREBASE_CONFIG);
    const db = dbM.getDatabase(app);
    const auth = authM.getAuth(app);
    FB = {
      stateRef: dbM.ref(db, "state"),
      set: v => dbM.set(FB.stateRef, v),
      signIn: pw => authM.signInWithEmailAndPassword(auth, CC_EMAIL, pw),
      signOut: () => authM.signOut(auth),
    };
    dbM.onValue(dbM.ref(db, ".info/connected"), s => { connected = !!s.val(); updateStatus(); });
    authM.onAuthStateChanged(auth, user => { if (user && !ui.role) setRole("cc"); });
    dbM.onValue(FB.stateRef, snap => {
      const data = snap.val();
      if (data == null) {
        /* Knoten existiert noch nicht — Erststart: sobald das Command Center
           angemeldet ist, werden die eingebetteten Startdaten geschrieben.
           (Nur bei wirklich fehlendem Knoten, sonst droht eine Schreib-Schleife.) */
        dbEmpty = true;
        if (ui.role === "cc" && state.events.length) schedulePush();
        updateStatus();
        return;
      }
      dbEmpty = false;
      if (dirty || pushing) { updateStatus(); return; }   // eigene Änderung ist unterwegs
      state = normalizeState(data);
      if (!currentEvent()) {
        const sorted = state.events.slice().sort((a, b) => (a.datum || "").localeCompare(b.datum || ""));
        ui.currentEventId = sorted.length ? sorted[sorted.length - 1].id : null;
        ui.runId = "q1";
      }
      const ae = document.activeElement;
      const typing = ui.role === "cc" && ae && ae.tagName === "INPUT" && ae.id !== "eventSelect";
      if (ui.role && !typing) render();
      else { const st = document.getElementById("stamp"); if (st) st.textContent = state.updatedAt ? "Stand: " + fmtStand(state.updatedAt) : ""; }
      updateStatus();
    }, err => { fbFailed = true; updateStatus(); });
  } catch (e) { FB = null; fbFailed = true; updateStatus(); }
}
const fbInit = initFirebase();   // Login wartet darauf, falls Firebase noch lädt

function schedulePush() {
  dirty = true; updateStatus();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(tryPush, 800);
}
async function tryPush() {
  if (!dirty || pushing) return;
  if (DEMO || !FB) { dirty = false; updateStatus(); return; }   // Demo: nur lokal in dieser Ansicht
  pushing = true; updateStatus();
  try {
    const payload = { v: 1, events: JSON.parse(JSON.stringify(state.events)), updatedAt: new Date().toISOString() };
    await FB.set(payload);
    state.updatedAt = payload.updatedAt;
    dirty = false;
    const st = document.getElementById("stamp");
    if (st) st.textContent = "Stand: " + fmtStand(state.updatedAt);
  } catch (e) {
    toast("Speichern abgelehnt — bitte als Command Center anmelden.");
    dirty = false;
  }
  pushing = false; updateStatus();
}
function persist() { if (ui.role === "cc") schedulePush(); }

/* ---------- Status-Chip ---------- */
function updateStatus() {
  const chip = document.getElementById("statusChip");
  const txt = document.getElementById("statusTxt");
  const off = document.getElementById("offBanner");
  if (!chip) return;
  chip.classList.remove("live", "saving", "off");
  let banner = null;
  if (pushing) { chip.classList.add("saving"); txt.textContent = "Speichert"; }
  else if (dirty && !DEMO) { chip.classList.add("saving"); txt.textContent = "Ausstehend"; }
  else if (DEMO) {
    chip.classList.add("off"); txt.textContent = "Demo";
    banner = "Demo-Modus — die Firebase-Konfiguration ist noch nicht eingetragen. Änderungen bleiben nur in dieser Ansicht.";
  }
  else if (fbFailed && !FB) {
    chip.classList.add("off"); txt.textContent = "Offline";
    banner = "Firebase konnte nicht geladen werden — Konfiguration prüfen.";
  }
  else if (!connected) { chip.classList.add("off"); txt.textContent = "Offline"; banner = "Keine Verbindung — angezeigt wird der letzte bekannte Stand."; }
  else { chip.classList.add("live"); txt.textContent = "Live"; }
  if (off) { off.hidden = !banner; if (banner) off.textContent = banner; }
}

/* ---------- Utils ---------- */
const $ = s => document.querySelector(s);
function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "html") n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const c of children) { if (c == null) continue; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
  return n;
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
let toastTimer = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function uid(p) { return p + "-" + Math.random().toString(36).slice(2, 8); }
function parseZeit(str) {
  if (str == null) return null;
  str = String(str).trim().replace(",", ".");
  if (!str) return null;
  const m = str.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);
  if (m) return parseInt(m[1], 10) * 60 + parseFloat(m[2]);
  const v = parseFloat(str);
  return isNaN(v) ? null : v;
}
function fmtZeit(z) {
  if (z == null || isNaN(z)) return "–";
  if (z >= 60) { const min = Math.floor(z / 60); return min + ":" + (z - min * 60).toFixed(2).padStart(5, "0"); }
  return z.toFixed(2);
}
function fmtDelta(d) { if (d == null || isNaN(d)) return "–"; return (d > 0 ? "+" : "") + d.toFixed(2); }
function fmtDatum(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; }
function fmtStand(iso) {
  if (!iso) return "";
  const d = new Date(iso);

  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- Berechnung (identisch zur Excel-Logik) ---------- */
function computeCourse(entries) {
  const withIdx = entries.map((e, i) => ({ name: e.name, zeit: e.zeit, idx: i }));
  const timed = withIdx.filter(e => e.zeit != null && !isNaN(e.zeit)).sort((a, b) => a.zeit - b.zeit);
  const untimed = withIdx.filter(e => e.zeit == null || isNaN(e.zeit));
  const best = timed.length ? timed[0].zeit : null;
  let sum = 0;
  const rows = timed.map((e, i) => { sum += e.zeit; return { ...e, rank: i + 1, diff: e.zeit - best, mean: sum / (i + 1) }; });
  return { rows, untimed, best, count: rows.length };
}
function computeRun(run, gender) {
  const blau = computeCourse(run[gender].blau);
  const rot = computeCourse(run[gender].rot);
  const n = Math.min(blau.count, rot.count);
  const deltas = [];
  for (let i = 0; i < n; i++) deltas.push({ rank: i + 1, delta: blau.rows[i].mean - rot.rows[i].mean });
  const finalDelta = n ? deltas[n - 1].delta : null;
  /* Stabilität: hat Δ auf allen Rangtiefen (mind. 3) dasselbe Vorzeichen?
     true = Tendenz stabil · false = Vorzeichen kippt je nach Rangtiefe · null = zu wenig Daten */
  const stable = n >= 3 ? deltas.every(d => Math.sign(d.delta) === Math.sign(finalDelta)) : null;
  return {
    blau, rot, n, deltas,
    finalDelta,
    bestDelta: (blau.best != null && rot.best != null) ? blau.best - rot.best : null,
    stable,
  };
}

/* ---------- Paarvergleich (Ergänzung Michael/Claude) ----------
   Jede:r Athlet:in fährt beide Kurse (Q1 auf dem einen, Q2 auf dem anderen).
   Pro Athlet:in: d = Zeit(Blau) − Zeit(Rot) -> die Fahrerstärke kürzt sich raus.
   Crossover-Korrektur über die beiden Startgruppen:
     Gruppe A (Blau zuerst): d = C − ΔR   ·   Gruppe B (Rot zuerst): d = C + ΔR
     Kurs-Effekt C = (median(dA) + median(dB)) / 2   (negativ = Blau schneller)
     Lauf-Effekt ΔR = (median(dB) − median(dA)) / 2  (positiv = 2. Lauf langsamer)
   Median statt Mittelwert -> robust gegen einzelne Fehlerläufe. */
function median(arr) {
  if (!arr.length) return null;
  const s = arr.slice().sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function computePaired(ev, gender) {
  if (!ev || ev.runs.length < 2) return null;
  const r1 = ev.runs.find(r => r.id === "q1") || ev.runs[0];
  const r2 = ev.runs.find(r => r.id === "q2") || ev.runs.find(r => r !== r1);
  if (!r1 || !r2 || r1 === r2) return null;
  const key = n => String(n || "").trim().toUpperCase();
  const map = {};
  for (const [run, tag] of [[r1, "r1"], [r2, "r2"]])
    for (const kurs of ["blau", "rot"])
      for (const e of run[gender][kurs])
        if (e.zeit != null && !isNaN(e.zeit) && key(e.name))
          (map[key(e.name)] = map[key(e.name)] || {})[tag] = { kurs, zeit: e.zeit };
  const pairs = [];
  for (const name in map) {
    const a = map[name];
    if (!a.r1 || !a.r2 || a.r1.kurs === a.r2.kurs) continue;
    const blau = a.r1.kurs === "blau" ? a.r1.zeit : a.r2.zeit;
    const rot = a.r1.kurs === "rot" ? a.r1.zeit : a.r2.zeit;
    pairs.push({ name, blau, rot, d: Math.round((blau - rot) * 100) / 100, blauZuerst: a.r1.kurs === "blau" });
  }
  pairs.sort((a, b) => a.d - b.d);
  const dA = pairs.filter(p => p.blauZuerst).map(p => p.d);
  const dB = pairs.filter(p => !p.blauZuerst).map(p => p.d);
  let delta = null, laufEffekt = null, korrigiert = false;
  if (dA.length && dB.length) {
    delta = (median(dA) + median(dB)) / 2;
    laufEffekt = (median(dB) - median(dA)) / 2;
    korrigiert = true;
  } else if (pairs.length) {
    delta = median(pairs.map(p => p.d));
  }
  return {
    pairs, delta, laufEffekt, korrigiert,
    blauSchneller: pairs.filter(p => p.d < 0).length,
    labels: { r1: r1.label, r2: r2.label },
  };
}

/* ---------- Login ---------- */
async function sha256hex(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
}
function setRole(role) {
  ui.role = role;
  try {
    if (role === "coach" || (role === "cc" && (DEMO || !FB))) localStorage.setItem(ROLE_KEY, role);
    else localStorage.removeItem(ROLE_KEY);
  } catch (e) {}
  $("#login").hidden = !!role;
  $("#app").hidden = !role;
  if (role) enterApp();
}
async function handleLogin(ev) {
  ev.preventDefault();
  const pw = $("#pwInput").value;
  let hash = "";
  try { hash = await sha256hex(pw); } catch (e) { $("#loginErr").textContent = "Dieser Browser unterstützt den Login nicht."; return; }
  if (hash === HASH_COACH) { setRole("coach"); return; }
  if (!DEMO) { try { await fbInit; } catch (e) {} }   // warten, falls Firebase noch lädt
  if (FB) {
    $("#loginErr").textContent = "";
    try { await FB.signIn(pw); setRole("cc"); return; }
    catch (e) { /* falsches Passwort → Fehlermeldung unten */ }
  } else if (hash === HASH_CC) { setRole("cc"); return; }   // Demo-Modus ohne Firebase
  {
    $("#loginErr").textContent = "Passwort stimmt nicht — bitte nochmals versuchen.";
    const card = $("#loginCard");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    $("#pwInput").select();
  }
}
function logout() {
  if (FB) { try { FB.signOut(); } catch (e) {} }
  setRole(null);
  $("#pwInput").value = ""; $("#loginErr").textContent = "";
  setTimeout(() => $("#pwInput").focus(), 100);
}

    tr.appendChild(el("td", { class: "diffcell" }, r.diff != null && r.rank > 1 ? "+" + r.diff.toFixed(2) : (r.rank === 1 ? "—" : "")));
  }
  tr.appendChild(el("td", { class: "meancell" }, r.mean != null ? r.mean.toFixed(2) : ""));

function commitZeit(run, kurs, idx, raw) {
  const list = run[ui.gender][kurs];

  const v = parseZeit(raw);
  if (v == null) { toast("Zeit nicht lesbar — z. B. 36.75 oder 1:12.34"); render(); return; }
  list[idx].zeit = Math.round(v * 100) / 100;
  persist(); render();
}
function commitDiff(run, kurs, idx, raw) {
  const list = run[ui.gender][kurs];
  if (raw.trim() === "") { list[idx].zeit = null; persist(); render(); return; }
  const v = parseZeit(raw.replace("+", ""));
  if (v == null) { toast("Diff nicht lesbar — z. B. 0.75"); render(); return; }
  const others = list.filter((e, i) => i !== idx && e.zeit != null);
  if (!others.length) { toast("Zuerst die Zeit des:der Führenden eintragen."); render(); return; }
  const best = Math.min(...others.map(e => e.zeit));
  list[idx].zeit = Math.round((best + v) * 100) / 100;
  persist(); render();
}

function verdictParts(delta, n) {
  if (delta == null) return { cls: "neutral", html: "Für den Vergleich braucht es auf beiden Kursen mindestens je eine Zeit." };
  const abs = Math.abs(delta).toFixed(2);
  if (Math.abs(delta) < 0.005) return { cls: "neutral", html: `Beide Läufe sind praktisch gleich schnell <b>(Ø Top ${n})</b>.` };
  const kurs = delta < 0 ? "blau" : "rot";
  return { cls: kurs, html: `Lauf <b style="color:var(--${kurs})">${KURS_LABEL[kurs]}</b> ist im Schnitt <b>${abs} s</b> schneller (Ø der Top ${n} beider Kurse).` };
}
function renderAnalyse(run) {
  const res = computeRun(run, ui.gender);
  const wrap = el("div", { class: "analyse" });
  wrap.appendChild(bigVerdict(res));

  const verdict = el("div", { class: "verdict " + v.cls });
  verdict.appendChild(el("div", { class: "vdot", style: v.cls === "blau" ? "background:var(--blau)" : v.cls === "rot" ? "background:var(--rot)" : "" }));
  verdict.appendChild(el("div", { class: "vtext", html: v.html + (res.bestDelta != null ? `<br><span style="color:var(--muted);font-size:12.5px">Bestzeiten: Blau ${fmtZeit(res.blau.best)} vs. Rot ${fmtZeit(res.rot.best)} (Δ ${fmtDelta(res.bestDelta)} s)</span>` : "") }));
  if (res.finalDelta != null)
    verdict.appendChild(el("div", { class: "vdelta", style: `color:var(--${res.finalDelta <= 0 ? "blau" : "rot"})` }, fmtDelta(res.finalDelta) + " s"));
  wrap.appendChild(verdict);
  if (res.stable != null)
    wrap.appendChild(el("div", { class: "stabnote " + (res.stable ? "ok" : "warn") },
      res.stable ? "✓ Tendenz über alle Rangtiefen stabil"
                 : "⚠ Tendenz uneinheitlich — Δ wechselt je nach Rangtiefe das Vorzeichen"));
  if (res.deltas.length) {
    const card = el("div", { class: "card chartcard" });
    card.appendChild(el("h4", null, "Δ Zeit nach Rang (kumulativer Mean)"));
    card.appendChild(el("div", { class: "sub" }, "Ø der Top-n-Zeiten je Kurs, Differenz Blau − Rot. Balken links: Blau schneller · rechts: Rot schneller."));
    const chart = el("div", { class: "dchart" });
    const maxAbs = Math.max(...res.deltas.map(d => Math.abs(d.delta)), 0.05);
    for (const d of res.deltas) {

      const val = el("div", { class: "dval", style: (isBlau ? `right:calc(50% + ${frac}% + 6px);color:var(--blau)` : `left:calc(50% + ${frac}% + 6px);color:var(--rot)`) }, fmtDelta(d.delta));
      chart.appendChild(el("div", { class: "drow" },
        el("div", { class: "dl" }, "Top " + d.rank),
        el("div", { class: "dtrack" }, el("div", { class: "dmid" }), bar, val)));
    }
    card.appendChild(chart);
    card.appendChild(el("div", { class: "dlegend", html:

      `<span style="color:var(--faint)">negativ = Blau vorn</span>` }));
    wrap.appendChild(card);
  }
  return wrap;
}

  const wrap = el("div");
  const grid = el("div", { class: "sum-grid" });
  const tableRows = [];
  for (const run of ev.runs) {
    for (const g of ["frauen", "maenner"]) {
      const res = computeRun(run, g);
      if (!res.blau.count && !res.rot.count) continue;
      const title = `${run.label} · ${GENDER_LABEL[g]}`;
      const card = el("div", { class: "card sumcard" });
      card.appendChild(el("div", { class: "sc-head" }, el("h4", null, title), verdictChip(res)));
      card.appendChild(el("div", { class: "sumline", html: `<span>Best <span class="cb">Blau</span></span><b>${res.blau.rows[0] ? esc(res.blau.rows[0].name) + " · " + fmtZeit(res.blau.best) : "–"}</b>` }));
      card.appendChild(el("div", { class: "sumline", html: `<span>Best <span class="cr">Rot</span></span><b>${res.rot.rows[0] ? esc(res.rot.rows[0].name) + " · " + fmtZeit(res.rot.best) : "–"}</b>` }));
      card.appendChild(el("div", { class: "sumline", html: `<span>Ø Top ${res.n || "–"}</span><b><span class="cb">${res.n ? res.blau.rows[res.n - 1].mean.toFixed(2) : "–"}</span> / <span class="cr">${res.n ? res.rot.rows[res.n - 1].mean.toFixed(2) : "–"}</span></b>` }));
      card.appendChild(el("div", { class: "sumline", html: `<span>Δ Zeit (Mean)</span><b>${res.finalDelta != null ? fmtDelta(res.finalDelta) + " s" : "–"}</b>` }));
      grid.appendChild(card);
      tableRows.push({ title, res });
    }
  }
  if (!grid.children.length) {
    wrap.appendChild(el("div", { class: "card" }, el("div", { class: "empty-hint" }, "Noch keine Zeiten in diesem Event erfasst.")));
    return wrap;
  }
  wrap.appendChild(grid);
  const tcard = el("div", { class: "card", style: "margin-top:14px;padding:14px 16px" });
  tcard.appendChild(el("h4", { style: "font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px;font-weight:700" }, "Gesamtübersicht " + eventTitle(ev)));
  const tab = el("table", { class: "sumtab" });
  tab.appendChild(el("thead", null, el("tr", null,
    el("th", null, "Lauf"), el("th", null, "Best Blau"), el("th", null, "Best Rot"),
    el("th", null, "Ø Blau"), el("th", null, "Ø Rot"), el("th", null, "Δ"))));
  const tb = el("tbody");
  for (const { title, res } of tableRows) {
    const dCol = res.finalDelta == null ? "var(--muted)" : res.finalDelta <= 0 ? "var(--blau)" : "var(--rot)";
    tb.appendChild(el("tr", null,
      el("td", null, title),
      el("td", null, fmtZeit(res.blau.best)), el("td", null, fmtZeit(res.rot.best)),
      el("td", null, res.n ? res.blau.rows[res.n - 1].mean.toFixed(2) : "–"),
      el("td", null, res.n ? res.rot.rows[res.n - 1].mean.toFixed(2) : "–"),
      el("td", { style: "color:" + dCol + ";font-weight:700" }, res.finalDelta != null ? fmtDelta(res.finalDelta) : "–")));
  }
  tab.appendChild(tb);
  const scroll = el("div", { style: "overflow-x:auto" }); scroll.appendChild(tab);
  tcard.appendChild(scroll);
  wrap.appendChild(tcard);
  return wrap;
}
function verdictChip(res) {
  if (res.finalDelta == null) return el("span", { class: "chip neutral" }, "unvollständig");
  if (Math.abs(res.finalDelta) < 0.005) return el("span", { class: "chip neutral" }, "ausgeglichen");
  if (res.finalDelta < 0) return el("span", { class: "chip blau" }, "BLAU −" + Math.abs(res.finalDelta).toFixed(2) + " s");
  return el("span", { class: "chip rot" }, "ROT −" + res.finalDelta.toFixed(2) + " s");
}

/* ---------- Coach-Ansicht (kompakt, live) ---------- */
function renderCoachPicker() {
  const p = $("#evpick");
  p.hidden = false;
  p.innerHTML = "";
  const sel = el("select", { class: "evpick-select", "aria-label": "Event wählen" });
  const sorted = state.events.slice().sort((a, b) => (a.datum || "").localeCompare(b.datum || ""));
  for (const ev of sorted) sel.appendChild(el("option", { value: ev.id }, eventTitle(ev)));
  if (currentEvent()) sel.value = ui.currentEventId;
  sel.addEventListener("change", () => { ui.currentEventId = sel.value; ui.runId = "q1"; render(); });
  p.appendChild(sel);
  p.appendChild(el("span", { html: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" style="position:absolute;right:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);pointer-events:none"><path d="M6 9l6 6 6-6"/></svg>' }));
}
function renderCoach(c, ev) {
  if (!ev) { c.appendChild(el("div", { class: "ccard" }, el("div", { class: "empty-hint" }, "Noch keine Events veröffentlicht."))); return; }
  if (ui.gender === "summary") { c.appendChild(renderCoachSummary(ev)); return; }
  const sumRows = [];
  for (const run of ev.runs) {
    const res = computeRun(run, ui.gender);
    if (!res.blau.count && !res.rot.count) continue;
    c.appendChild(renderCoachRunCard(run, res));
    sumRows.push({ label: run.label, res });
  }
  const paired = renderPairedCard(ev, ui.gender);
  if (paired) { paired.classList.add("ccard-style"); c.appendChild(paired); }
  if (!c.children.length) {
    c.appendChild(el("div", { class: "ccard" }, el("div", { class: "empty-hint" }, "Für " + GENDER_LABEL[ui.gender] + " sind noch keine Zeiten erfasst.")));
  }
}
/* ---------- Kernaussage gross (Ergänzung Michael/Claude) ---------- */
function bigVerdict(res) {
  if (res.finalDelta == null)
    return el("div", { class: "bigverdict open" },
      el("div", { class: "bv-course", style: "font-size:15px;font-weight:700" }, "Noch offen"),
      el("div", { class: "bv-txt", style: "opacity:1" }, "zu wenig Zeiten für einen Vergleich"));
  if (Math.abs(res.finalDelta) < 0.005)
    return el("div", { class: "bigverdict neutral" },
      el("div", { class: "bv-course" }, "AUSGEGLICHEN"),
      el("div", { class: "bv-txt" }, "Ø Top " + res.n),
      el("div", { class: "bv-delta" }, "±0.00 s"));
  const kurs = res.finalDelta < 0 ? "blau" : "rot";
  return el("div", { class: "bigverdict " + kurs },
    el("div", { class: "bv-course" }, KURS_LABEL[kurs].toUpperCase()),
    el("div", { class: "bv-txt" }, "schneller · Ø Top " + res.n),
    res.stable === false ? el("div", { class: "bv-warn", title: "Δ wechselt je nach Rangtiefe das Vorzeichen" }, "⚠ instabil") : null,
    el("div", { class: "bv-delta" }, Math.abs(res.finalDelta).toFixed(2) + " s"));
}

function renderCoachRunCard(run, res) {
  const card = el("div", { class: "ccard" });
  card.appendChild(el("div", { class: "runhead" }, el("h3", null, run.label + " · " + GENDER_LABEL[ui.gender])));
  card.appendChild(bigVerdict(res));
  const duo = el("div", { class: "duo" });
  for (const [kurs, cls] of [["blau", "b"], ["rot", "r"]]) {
    const comp = res[kurs];
    const col = el("div", { class: "col " + cls });
    col.appendChild(el("div", { class: "colhead", html: "<i></i>" + KURS_LABEL[kurs] + (comp.best != null ? ' <span style="margin-left:auto;color:var(--muted);text-transform:none;letter-spacing:0">' + fmtZeit(comp.best) + "</span>" : "") }));
    if (comp.rows.length) {
      const t = el("table", { class: "t" });
      for (const r of comp.rows) {
        t.appendChild(el("tr", { class: r.rank === 1 ? "best" : "" },
          el("td", { class: "rk" }, String(r.rank)),
          el("td", { class: "nm" }, r.name),
          el("td", { class: "zt" }, fmtZeit(r.zeit)),
          el("td", { class: "df" }, r.rank > 1 ? "+" + r.diff.toFixed(2) : "—")));
      }
      col.appendChild(t);
    } else col.appendChild(el("div", { class: "emptycol" }, "keine Zeiten"));
    duo.appendChild(col);
  }
  card.appendChild(duo);
  return card;
}
function renderCoachSummary(ev) {
  const wrap = el("div");
  /* Kernaussage pro Lauf als grosse Kacheln (Ergänzung Michael/Claude) */
  const grid = el("div", { class: "vgrid" });
  const card = el("div", { class: "ccard sumwrap" });
  card.appendChild(el("div", { class: "sumhead" }, "Übersicht " + eventTitle(ev)));
  const t = el("table", { class: "s" });
  t.appendChild(el("tr", null,
    el("th", null, "Lauf"), el("th", null, "Best B"), el("th", null, "Best R"), el("th", null, "Δ Mean")));
  let any = false;
  for (const run of ev.runs) {
    for (const g of ["frauen", "maenner"]) {
      const res = computeRun(run, g);
      if (!res.blau.count && !res.rot.count) continue;
      any = true;
      const label = run.label + " " + GENDER_LABEL[g];
      const kurs = res.finalDelta == null ? null : Math.abs(res.finalDelta) < 0.005 ? "neutral" : res.finalDelta < 0 ? "blau" : "rot";
      grid.appendChild(el("div", { class: "vtile " + (kurs || "open") },
        el("div", { class: "vt-label" }, label),
        el("div", { class: "vt-course" }, kurs == null ? "offen" : kurs === "neutral" ? "AUSGEGL." : KURS_LABEL[kurs].toUpperCase()),
        el("div", { class: "vt-delta" }, res.finalDelta != null ? Math.abs(res.finalDelta).toFixed(2) + " s" : "–")));
      const col = res.finalDelta == null ? "var(--muted)" : res.finalDelta <= 0 ? "var(--blau)" : "var(--rot)";
      t.appendChild(el("tr", null,
        el("td", null, label),
        el("td", null, fmtZeit(res.blau.best)), el("td", null, fmtZeit(res.rot.best)),
        el("td", { style: "color:" + col + ";font-weight:700" }, res.finalDelta != null ? fmtDelta(res.finalDelta) : "–")));
    }
  }
  if (!any) return el("div", { class: "ccard" }, el("div", { class: "empty-hint" }, "Noch keine Zeiten erfasst."));
  wrap.appendChild(grid);
  card.appendChild(t);
  wrap.appendChild(card);
  return wrap;
}

/* ---------- Sheets (Command Center) ---------- */
function openOverlay(id) { $(id).classList.add("show"); }
function closeOverlays() { for (const o of document.querySelectorAll(".overlay")) o.classList.remove("show"); }
for (const o of document.querySelectorAll(".overlay"))
  o.addEventListener("click", e => { if (e.target === o) closeOverlays(); });

function openMenu() {
  const s = $("#menuSheet");
  s.innerHTML = "";
  const mk = (icon, label, fn, cls) => el("button", { class: "menu-item " + (cls || ""), onclick: () => { closeOverlays(); fn(); }, html: icon + "<span>" + label + "</span>" });
  const list = el("div", { class: "menu-list" });
  if (ui.role === "cc") {
    s.appendChild(el("h3", { html: ICONS.edit + "Command Center" }));
    list.appendChild(mk(ICONS.plus, "Neues Event", () => openEventForm(null)));
    if (currentEvent()) {
      list.appendChild(mk(ICONS.edit, "Event bearbeiten", () => openEventForm(currentEvent())));
      list.appendChild(mk(ICONS.copy, "Event duplizieren", duplicateEvent));
      list.appendChild(mk(ICONS.trash, "Event löschen …", confirmDeleteEvent, "danger"));
    }
    list.appendChild(el("div", { class: "menu-sep" }));
    list.appendChild(mk(ICONS.send, "Jetzt speichern", () => { dirty = true; tryPush(); }));
  } else {
    s.appendChild(el("h3", { html: ICONS.edit + "Coaches" }));
  }
  list.appendChild(el("div", { class: "menu-sep" }));
  list.appendChild(mk(ICONS.logout, "Abmelden", logout));
  s.appendChild(list);
  openOverlay("#menuOverlay");
}
function openEventForm(ev) {
  const s = $("#eventSheet");
  s.innerHTML = "";
  s.appendChild(el("h3", { html: ICONS.edit + (ev ? "Event bearbeiten" : "Neues Event") }));
  const fOrt = el("input", { value: ev ? ev.ort : "", placeholder: "z. B. Scuol" });
  const fDat = el("input", { type: "date", value: ev ? ev.datum : "" });
  const fDis = el("select");
  for (const d of ["GS", "SL", "PGS", "PSL"]) fDis.appendChild(el("option", { value: d }, d));
  if (ev) fDis.value = ev.disziplin;
  if (!ev) {
    /* Schnellauswahl aus dem FIS-Weltcup-Kalender (Ergänzung Michael/Claude) */
    const fFis = el("select");
    fFis.appendChild(el("option", { value: "" }, "— manuell eingeben —"));
    for (let i = 0; i < FIS_WC_2627.length; i++) {
      const w = FIS_WC_2627[i];
      fFis.appendChild(el("option", { value: String(i) }, `${w.ort} · ${w.disziplin} · ${fmtDatum(w.datum)}`));
    }
    fFis.addEventListener("change", () => {
      const w = FIS_WC_2627[Number(fFis.value)];
      if (!w) return;
      fOrt.value = w.ort; fDat.value = w.datum; fDis.value = w.disziplin;
    });
    s.appendChild(el("div", { class: "field" }, el("label", null, "FIS Weltcup 2026/27 übernehmen"), fFis));
  }
  s.appendChild(el("div", { class: "field" }, el("label", null, "Ort"), fOrt));
  s.appendChild(el("div", { class: "field" }, el("label", null, "Datum"), fDat));
  s.appendChild(el("div", { class: "field" }, el("label", null, "Disziplin"), fDis));
  s.appendChild(el("div", { class: "btnrow" },
    el("button", { class: "btn", onclick: closeOverlays }, "Abbrechen"),
    el("button", {
      class: "btn primary", onclick: () => {
        const ort = fOrt.value.trim();
        if (!ort) { toast("Bitte einen Ort angeben."); return; }
        if (ev) { ev.ort = ort; ev.datum = fDat.value; ev.disziplin = fDis.value; }
        else {
          const ne = newEvent(ort, fDis.value, fDat.value || new Date().toISOString().slice(0, 10));
          state.events.push(ne); ui.currentEventId = ne.id; ui.runId = "q1";
        }
        persist(); closeOverlays(); render();
      },
    }, ev ? "Speichern" : "Anlegen")));
  openOverlay("#eventOverlay");
  setTimeout(() => fOrt.focus(), 50);
}
function duplicateEvent() {
  const ev = currentEvent(); if (!ev) return;
  const copy = JSON.parse(JSON.stringify(ev));
  copy.id = uid("ev"); copy.ort = ev.ort + " (Kopie)";
  state.events.push(copy); ui.currentEventId = copy.id;
  persist(); render(); toast("Event dupliziert.");
}
function confirmDeleteEvent() {
  const ev = currentEvent(); if (!ev) return;
  const s = $("#eventSheet");
  s.innerHTML = "";
  s.appendChild(el("h3", { html: ICONS.trash + "Event löschen?" }));
  s.appendChild(el("div", { class: "note warn" }, `„${eventTitle(ev)}" wird mit allen Zeiten für alle entfernt. Das lässt sich nicht rückgängig machen.`));
  s.appendChild(el("div", { class: "btnrow" },
    el("button", { class: "btn", onclick: closeOverlays }, "Abbrechen"),
    el("button", {
      class: "btn danger", onclick: () => {
        state.events = state.events.filter(e => e.id !== ev.id);
        const sorted = state.events.slice().sort((a, b) => (a.datum || "").localeCompare(b.datum || ""));
        ui.currentEventId = sorted.length ? sorted[sorted.length - 1].id : null;
        ui.runId = "q1"; persist(); closeOverlays(); render();
      },
    }, "Löschen")));
  openOverlay("#eventOverlay");
}
function openRunSheet(run) {
  const ev = currentEvent(); if (!ev) return;
  const s = $("#eventSheet");
  s.innerHTML = "";
  s.appendChild(el("h3", { html: ICONS.edit + (run ? `Lauf „${run.label}"` : "Neuer Lauf") }));
  const fLabel = el("input", { value: run ? run.label : "Q" + (ev.runs.length + 1), placeholder: "z. B. Q3, Finale" });
  s.appendChild(el("div", { class: "field" }, el("label", null, "Bezeichnung"), fLabel));
  const btns = el("div", { class: "btnrow" });
  btns.appendChild(el("button", { class: "btn", onclick: closeOverlays }, "Abbrechen"));
  if (run && ev.runs.length > 1) btns.appendChild(el("button", {
    class: "btn danger", onclick: () => {
      ev.runs = ev.runs.filter(r => r.id !== run.id);
      if (ui.runId === run.id) ui.runId = ev.runs[0].id;
      persist(); closeOverlays(); render();
    },
  }, "Löschen"));
  btns.appendChild(el("button", {
    class: "btn primary", onclick: () => {
      const label = fLabel.value.trim() || "Lauf";
      if (run) run.label = label;
      else { const nr = emptyRun(uid("run"), label); ev.runs.push(nr); ui.runId = nr.id; }
      persist(); closeOverlays(); render();
    },
  }, run ? "Speichern" : "Hinzufügen"));
  s.appendChild(btns);
  openOverlay("#eventOverlay");
}

/* ---------- Wiring ---------- */
$("#loginForm").addEventListener("submit", handleLogin);
$("#peekBtn").addEventListener("click", () => {
  const f = $("#pwInput");
  f.type = f.type === "password" ? "text" : "password";
  f.focus();
});
$("#eventSelect").addEventListener("change", e => { ui.currentEventId = e.target.value; ui.runId = "q1"; render(); });
$("#genderSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  ui.gender = b.dataset.g; render();
});
$("#menuBtn").addEventListener("click", openMenu);

/* ---------- Init ---------- */
(function init() {
  let saved = null;
  try { saved = localStorage.getItem(ROLE_KEY); } catch (e) {}
  if (saved === "coach" || (saved === "cc" && DEMO)) setRole(saved);
  else { $("#login").hidden = false; $("#app").hidden = true; setTimeout(() => { try { $("#pwInput").focus(); } catch (e) {} }, 300); }
})();

</script>
